<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Моите пари</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050506;
  --card: #2a2a2c;
  --card-line: #3a3a3d;
  --field: #2f2f32;
  --fg: #f4f4f5;
  --muted: #a3a3a8;
  --accent: #2f6bd0;
  --accent-fg: #ffffff;
  --in: #6fd69a;
  --out: #ff9b8f;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; margin: 0; background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  padding-inline: 16px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 28px; padding: 24px; }
.balance { text-align: center; padding-block: 28px; }
.balance .label { color: var(--muted); font-size: 15px; }
.balance .value { font-size: 44px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; overflow-wrap: anywhere; }
.balance .value.neg { color: var(--out); }
label.lbl { display: block; font-size: 15px; font-weight: 500; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 12px; }
input {
  width: 100%; min-width: 0; background: var(--field); color: var(--fg);
  border: 1px solid var(--card-line); border-radius: 22px; font: inherit;
  padding: 0 20px; outline: none;
}
input::placeholder { color: #8a8d99; }
input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,107,208,.35); }
#amount { height: 80px; text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
#amount.bad { border-color: var(--out); }
#note { height: 52px; font-size: 16px; text-align: left; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
button { font: inherit; cursor: pointer; border: 1px solid var(--card-line); color: var(--fg); background: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { height: 80px; border-radius: 24px; font-size: 24px; font-weight: 700; min-width: 0; }
.btn.add { background: var(--card); }
.btn.spend { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:active { transform: scale(.98); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.head h2 { margin: 0; font-size: 22px; font-weight: 700; }
.clear { border: 0; color: var(--muted); font-size: 16px; padding: 8px 4px; }
.confirm { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
.confirm button { border-radius: 12px; padding: 8px 14px; font-size: 15px; }
.confirm .yes { background: var(--out); color: #2b0b07; border-color: var(--out); font-weight: 700; }
.empty { color: var(--muted); font-size: 16px; margin: 0; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-top: 1px solid var(--card-line); }
li:first-child { border-top: 0; padding-top: 0; }
.meta { flex: 1; min-width: 0; }
.meta .t { font-weight: 500; overflow-wrap: anywhere; }
.meta .d { color: var(--muted); font-size: 13px; margin-top: 2px; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--in); }
.amt.out { color: var(--out); }
.del { border: 0; color: var(--muted); font-size: 22px; line-height: 1; width: 36px; height: 36px; border-radius: 10px; }
.status { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>
<main class="app">
  <section class="card balance" aria-live="polite">
    <div class="label">Текущ баланс</div>
    <div class="value" id="balance">0,00 лв.</div>
  </section>

  <section class="card">
    <label class="lbl" for="amount">Сума</label>
    <div class="field">
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="Напр. 50">
      <input id="note" type="text" autocomplete="off" maxlength="60" placeholder="Бележка (по желание)">
    </div>
    <div class="actions">
      <button class="btn add" id="addBtn" type="button">+ Добави</button>
      <button class="btn spend" id="spendBtn" type="button">− Разход</button>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <h2>История</h2>
      <button class="clear" id="clearBtn" type="button" hidden>Изчисти</button>
      <div class="confirm" id="confirmBox" hidden>
        <span>Всички записи?</span>
        <button class="yes" id="yesBtn" type="button">Изтрий</button>
        <button id="noBtn" type="button">Не</button>
      </div>
    </div>
    <p class="empty" id="empty">Все още няма движения.</p>
    <ul id="list"></ul>
  </section>

  <p class="status">Записите се пазят само на този телефон.</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LS = "moite-pari-v1";
  var entries = [];

  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { return []; } }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(entries)); } catch (e) {} }

  function money(n) {
    return n.toLocaleString("bg-BG", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " лв.";
  }
  function when(ts) {
    try { return new Date(ts).toLocaleString("bg-BG", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return ""; }
  }

  function render() {
    var sorted = entries.slice().sort(function (a, b) { return b.ts - a.ts; });
    var bal = 0;
    sorted.forEach(function (e) { bal += e.type === "in" ? e.amount : -e.amount; });
    bal = Math.round(bal * 100) / 100;
    var b = $("balance");
    b.textContent = money(bal);
    b.classList.toggle("neg", bal < 0);

    var list = $("list");
    list.textContent = "";
    sorted.forEach(function (e) {
      var li = document.createElement("li");
      var meta = document.createElement("div"); meta.className = "meta";
      var t = document.createElement("div"); t.className = "t";
      t.textContent = e.note || (e.type === "in" ? "Приход" : "Разход");
      var d = document.createElement("div"); d.className = "d"; d.textContent = when(e.ts);
      meta.appendChild(t); meta.appendChild(d);
      var a = document.createElement("div");
      a.className = "amt " + (e.type === "in" ? "in" : "out");
      a.textContent = (e.type === "in" ? "+" : "−") + money(e.amount);
      var x = document.createElement("button");
      x.className = "del"; x.type = "button"; x.textContent = "×";
      x.setAttribute("aria-label", "Изтрий записа");
      x.addEventListener("click", function () { removeOne(e.id); });
      li.appendChild(meta); li.appendChild(a); li.appendChild(x);
      list.appendChild(li);
    });
    var has = sorted.length > 0;
    $("empty").hidden = has;
    if (!has) { $("clearBtn").hidden = true; $("confirmBox").hidden = true; }
    else if ($("confirmBox").hidden) { $("clearBtn").hidden = false; }
  }

  function parseAmount(s) {
    var n = parseFloat(String(s).replace(/\s/g, "").replace(",", "."));
    if (!isFinite(n) || n <= 0) return null;
    return Math.round(n * 100) / 100;
  }

  function add(type) {
    var inp = $("amount");
    var amount = parseAmount(inp.value);
    if (amount === null) { inp.classList.add("bad"); inp.focus(); return; }
    inp.classList.remove("bad");
    var ts = Date.now();
    entries.push({ id: String(ts) + Math.random().toString(36).slice(2, 6), type: type, amount: amount, note: $("note").value.trim(), ts: ts });
    inp.value = ""; $("note").value = "";
    lsSave(); render();
  }

  function removeOne(id) {
    entries = entries.filter(function (e) { return e.id !== id; });
    lsSave(); render();
  }

  function clearAll() {
    $("confirmBox").hidden = true;
    entries = []; lsSave(); render();
  }

  $("addBtn").addEventListener("click", function () { add("in"); });
  $("spendBtn").addEventListener("click", function () { add("out"); });
  $("amount").addEventListener("input", function () { this.classList.remove("bad"); });
  $("amount").addEventListener("keydown", function (e) { if (e.key === "Enter") add("out"); });
  $("clearBtn").addEventListener("click", function () { $("clearBtn").hidden = true; $("confirmBox").hidden = false; });
  $("noBtn").addEventListener("click", function () { $("confirmBox").hidden = true; render(); });
  $("yesBtn").addEventListener("click", clearAll);

  entries = lsLoad();
  render();
})();
</script>
</body>
</html>
