name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - loader.html
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android project
        run: |
          mkdir app
          cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp ../loader.html www/index.html
          cp ../app.html www/app.html
          sed -i "s|__REPO__|${{ github.repository }}|g; s|__BRANCH__|${{ github.event.repository.default_branch }}|g" www/index.html
          grep -n "raw.githubusercontent.com" www/index.html
          npx cap init "Моите пари" com.moitepari.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moite-pari-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
