name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - loader.html
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use saved signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using saved signing key"
          else
            echo "No saved signing key, a new one is used"
          fi

      - name: Create Android project
        run: |
          mkdir app
          cd app
          npm init -y
          npm install "@capacitor/core@>=8.3.2 <9" "@capacitor/cli@>=8.3.2 <9" "@capacitor/android@>=8.3.2 <9"
          mkdir www
          cp ../loader.html www/index.html
          cp ../app.html www/app.html
          cp ../core.js www/core.js
          sed -i "s|__REPO__|${{ github.repository }}|g; s|__BRANCH__|${{ github.event.repository.default_branch }}|g" www/index.html
          grep -n "raw.githubusercontent.com" www/index.html
          npx cap init "Моите пари" com.moitepari.app --web-dir www
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.plugins=Object.assign({},c.plugins,{SystemBars:{style:'DARK'}});fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          cat capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moite-pari-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
