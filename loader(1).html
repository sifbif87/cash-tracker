<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Моите пари</title>
<style>
  /* Capacitor 8 подава размерите на системните ленти като --safe-area-inset-*. */
  :root {
    --top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }
  html, body { margin: 0; height: 100%; background: #050506; }
  body { display: flex; flex-direction: column; }
  .bar-top { flex: none; height: var(--top); background: #050506; }
  .bar-bottom { flex: none; height: var(--bottom); background: #0d0d0f; }
  iframe { display: block; flex: 1 1 auto; min-height: 0; border: 0; width: 100%; background: #050506; }
</style>
</head>
<body>
<div class="bar-top"></div>
<iframe id="app" title="Моите пари"></iframe>
<div class="bar-bottom"></div>
<script>
(function () {
  /* __REPO__ и __BRANCH__ се попълват от GitHub при build. */
  var REMOTE = "https://raw.githubusercontent.com/__REPO__/__BRANCH__/app.html";
  var KEY = "moite-pari-app-cache";
  var frame = document.getElementById("app");
  var shown = null, okSeen = false, timer = null;

  function valid(h) { return typeof h === "string" && h.length > 2000 && h.indexOf("moite-pari-app") !== -1; }

  window.addEventListener("message", function (e) {
    if (e.source === frame.contentWindow && e.data === "moite-pari-ok") okSeen = true;
  });

  function show(html, watch) {
    shown = html; okSeen = false;
    frame.srcdoc = html;
    clearTimeout(timer);
    if (watch) {
      /* Ако новата версия не стартира, връщаме вградената. */
      timer = setTimeout(function () {
        if (okSeen) return;
        try { localStorage.removeItem(KEY); } catch (e) {}
        loadBundled();
      }, 6000);
    }
  }

  function loadBundled() {
    fetch("app.html").then(function (r) { return r.text(); }).then(function (h) {
      if (valid(h)) show(h, false);
    });
  }

  var cached = null;
  try { cached = localStorage.getItem(KEY); } catch (e) {}
  if (valid(cached)) show(cached, true); else loadBundled();

  /* Проверка за нова версия на заден план. */
  fetch(REMOTE + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function (h) {
      if (!valid(h)) return;
      try { localStorage.setItem(KEY, h); } catch (e) {}
      if (h !== shown) show(h, true);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
