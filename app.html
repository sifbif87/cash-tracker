<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="moite-pari-app" content="1.6">
<title>Моите пари</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
.sub.over { color: var(--out); font-weight: 700; }
:root {
  --bg: #050506;
  --fg: #f4f4f5;
  --muted: #a3a3a8;
  --card: #2a2a2c;
  --card-a: #2a2a2c;
  --field: #2f2f32;
  --line: #3a3a3d;
  --nav: #0d0d0f;
  --nav-a: #0d0d0f;
  --track: #1b1b1d;
  --accent: #2f6bd0;
  --accent-fg: #ffffff;
  --accent-text: #8db4ff;
  --in: #6fd69a;
  --out: #ff9b8f;
  --scrim: rgba(5,5,6,.55);
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: var(--bg); }
body { min-height: 100%; margin: 0; background: transparent; }
body {
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  padding-inline: 16px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
.photo { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat; }
.scrim { position: fixed; inset: 0; z-index: -1; background: var(--scrim); }
.app { max-width: 480px; margin-inline: auto; }
.page { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card-a); border: 1px solid var(--line); border-radius: 28px; padding: 24px; }
.has-photo .card { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
h2 { margin: 0; font-size: 22px; font-weight: 700; }
h3 { margin: 0; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 500; background: var(--card-a); max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }

.balance { text-align: center; padding-block: 28px; }
.balance .label { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.balance .value { font-size: 44px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; overflow-wrap: anywhere; }
.balance .value.neg { color: var(--out); }
.balance .sub { color: var(--muted); font-size: 15px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.balance .tot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.balance .tot b { color: var(--fg); font-weight: 700; }

label.lbl { display: block; font-size: 15px; font-weight: 500; margin-bottom: 10px; }
.field { display: flex; flex-direction: column; gap: 12px; }
input, select {
  width: 100%; min-width: 0; background: var(--field); color: var(--fg);
  border: 1px solid var(--line); border-radius: 22px; font: inherit;
  padding: 0 20px; outline: none; height: 52px;
}
select { padding-inline: 16px; }
input::placeholder { color: #8a8d99; }
input:focus-visible, select:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,107,208,.35); }
input.bad { border-color: var(--out); }
input[type="range"] { height: 32px; padding: 0; background: transparent; border: 0; accent-color: var(--accent); }
#amount { height: 80px; text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }

button { font: inherit; cursor: pointer; border: 1px solid var(--line); color: var(--fg); background: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.btn { height: 80px; border-radius: 24px; font-size: 24px; font-weight: 700; min-width: 0; }
.btn.add { background: var(--card); }
.btn.spend, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:active, .sbtn:active { transform: scale(.98); }
.sbtn { height: 52px; border-radius: 20px; font-size: 17px; font-weight: 700; padding-inline: 18px; min-width: 0; }
.sbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.sbtn.full { width: 100%; }
.link { border: 0; color: var(--muted); font-size: 15px; padding: 8px 4px; }
.link.accent { color: var(--accent-text); font-weight: 500; }
.link.danger { color: var(--out); }
.msg { color: var(--out); font-size: 14px; margin: 0; }

.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.head.mb { margin-bottom: 18px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.confirm button { border-radius: 12px; padding: 8px 14px; font-size: 15px; }
.confirm .yes { background: var(--out); color: #2b0b07; border-color: var(--out); font-weight: 700; }
.empty { color: var(--muted); font-size: 16px; margin: 0; line-height: 1.45; }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; padding-top: 0; }
li:last-child { padding-bottom: 0; }
.meta { flex: 1; min-width: 0; }
.meta .t { font-weight: 500; overflow-wrap: anywhere; }
.meta .d { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--in); }
.amt.out { color: var(--out); }
.amt.goal { color: var(--accent-text); }
.del { border: 0; color: var(--muted); font-size: 22px; line-height: 1; width: 36px; height: 36px; border-radius: 10px; }
.day + .day { margin-top: 22px; }
.day h3 { font-size: 14px; font-weight: 500; color: var(--muted); text-transform: capitalize; margin-bottom: 12px; }

.goalform, .col { display: flex; flex-direction: column; gap: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; }
.formactions { display: flex; gap: 10px; }
.formactions .sbtn { flex: 1; }
.setrow { display: flex; flex-direction: column; gap: 10px; }
.card > .setrow + .setrow { margin-top: 22px; }

.goal { display: flex; flex-direction: column; gap: 14px; }
.g-sub { color: var(--muted); font-size: 14px; white-space: nowrap; }
.g-amounts { font-variant-numeric: tabular-nums; }
.g-amounts strong { font-size: 28px; font-weight: 700; }
.g-amounts span { color: var(--muted); font-size: 15px; }
.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; }
.bar.done > div { background: var(--in); }
.g-perday { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; }
.g-perday b { color: var(--fg); font-variant-numeric: tabular-nums; }
.g-done { text-align: center; color: var(--in); font-weight: 700; padding-block: 10px; }
.other { display: flex; flex-direction: column; gap: 10px; }
.other .formactions { gap: 8px; }
.g-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

.total { text-align: center; padding-block: 28px; }
.total .label { color: var(--muted); font-size: 15px; }
.total .value { font-size: 40px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; overflow-wrap: anywhere; }
.brk { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--line); text-align: left; }
.brk li { padding-block: 10px; border-top: 0; justify-content: space-between; }
.brk li span:first-child { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.brk li span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.trip { display: flex; flex-direction: column; gap: 10px; padding-block: 16px; border-top: 1px solid var(--line); }
.trip:first-child { border-top: 0; padding-top: 0; }
.trip .tv { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.trip .ts { color: var(--muted); font-size: 14px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { height: 52px; border-radius: 20px; font-size: 17px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--card); }
.sl { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.4; }
.status { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }

.chip svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-left: 6px; vertical-align: -1px; }
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; font-variant-numeric: tabular-nums; }
.fieldrow { display: flex; flex-direction: column; gap: 8px; }
.fieldrow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sumline { font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.quick { margin-bottom: 16px; flex-wrap: wrap; overflow: visible; }
.quick .chip { height: 38px; font-size: 14px; max-width: 100%; }
.quick .chip.q-in { border-color: var(--in); }
.quick .chip.q-add { color: var(--accent-text); border-style: dashed; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 15; max-width: 448px; margin-inline: auto; background: var(--fg); color: var(--bg); border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 500; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.toast button { border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 6px 4px; font-size: 15px; }
.fc { display: flex; flex-direction: column; gap: 6px; padding: 18px 24px; }
.fc .fc-h { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 500; }
.fc .fc-m { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.fc .fc-m.warn { color: #f0b34a; }
.fc .fc-m.bad { color: var(--out); }
.fc .fc-s { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.dsum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.dsum > div { background: var(--field); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.dsum small { color: var(--muted); font-size: 13px; }
.dsum b { font-size: 19px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dsum .pos b { color: var(--in); }
.dsum .neg b { color: var(--out); }
.debt { display: flex; flex-direction: column; gap: 8px; padding-block: 16px; border-top: 1px solid var(--line); }
.debt:first-child { border-top: 0; padding-top: 0; }
.debt .dh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.debt .dv { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.debt .dv.pos { color: var(--in); }
.debt .dv.neg { color: var(--out); }
.debt .ds { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.debt.done { opacity: .6; }
.check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; }
.check input { width: 24px; height: 24px; padding: 0; flex: none; accent-color: var(--accent); margin-top: 1px; }
.check span { display: flex; flex-direction: column; gap: 2px; }
.people { display: flex; flex-direction: column; margin-bottom: 18px; background: var(--field); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; }
.people .p { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.people .p:first-of-type { border-top: 0; }
.people .pn { font-weight: 500; overflow-wrap: anywhere; }
.people .ps { color: var(--muted); font-size: 12px; margin-top: 2px; }
.people .pv { font-weight: 700; font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.people .pv.pos { color: var(--in); } .people .pv.neg { color: var(--out); } .people .pv.eq { color: var(--muted); }
.people .ph { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; padding-top: 10px; }
.qrow { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.qrow:first-child { border-top: 0; }
.topbar { display: flex; justify-content: flex-end; margin-bottom: 8px; min-height: 44px; }
.gear { width: 44px; height: 44px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: var(--card-a); color: var(--muted); }
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gear[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--nav-a); border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
}
.has-photo .nav { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.nav-in { max-width: 480px; margin-inline: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.nav button { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 8px 0 6px; border-radius: 16px; min-width: 0; }
.nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--fg); background: var(--card); }
.nav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .btn:active, .sbtn:active { transform: none; } }
</style>
</head>
<body>
<div class="photo" id="photoLayer" hidden></div>
<div class="scrim" id="scrimLayer" hidden></div>
<main class="app">
  <div class="topbar"><button type="button" class="gear" id="gearBtn" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>

  <!-- Начало -->
  <div class="page" id="page-home">
    <div class="chips" id="chips" role="group"></div>

    <section class="card balance" aria-live="polite">
      <div class="label" id="balLabel"></div>
      <div class="value" id="balance"></div>
      <div class="sub" id="balSub" hidden></div>
      <div class="tot" id="balTotal"></div>
      <button class="link" id="lockNow" type="button" data-i18n="lock" hidden style="margin-top:8px"></button>
    </section>

    <section class="card fc" id="fcCard" hidden aria-live="polite">
      <div class="fc-h" data-i18n="fcTitle"></div>
      <div class="fc-m" id="fcMain"></div>
      <div class="fc-s" id="fcSub"></div>
    </section>

    <section class="card">
      <div class="chips quick" id="quick" role="group"></div>
      <label class="lbl" for="amount" id="amtLbl"></label>
      <div class="field">
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" data-i18n-ph="amountPh">
        <input id="note" type="text" autocomplete="off" maxlength="60" data-i18n-ph="notePh">
      </div>
      <p class="msg" id="homeMsg" style="margin-top:12px" hidden></p>
      <div class="actions">
        <button class="btn add" id="addBtn" type="button" data-i18n="income"></button>
        <button class="btn spend" id="spendBtn" type="button" data-i18n="expense"></button>
      </div>
    </section>

    <section class="card">
      <div class="head mb">
        <h2 data-i18n="recent"></h2>
        <button class="link accent" id="viewAll" type="button" data-i18n="viewAll" hidden></button>
      </div>
      <p class="empty" id="homeEmpty" data-i18n="none"></p>
      <ul id="homeList"></ul>
    </section>
    <p class="status" data-i18n="storageNote"></p>
  </div>

  <!-- Портфейли -->
  <div class="page" id="page-wallets" hidden>
    <section class="card total">
      <div class="label" data-i18n="totalAll"></div>
      <div class="value" id="totalVal"></div>
      <button class="sbtn" id="revealBtn" type="button" data-i18n="showTotal" hidden style="margin-top:14px"></button>
      <ul class="brk" id="breakdown"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="transfer" style="margin-bottom:18px"></h2>
      <div class="col">
        <div class="setrow" style="gap:8px">
          <label class="lbl" for="xAmt" id="xAmtLbl" style="margin:0"></label>
          <input id="xAmt" type="text" inputmode="decimal" autocomplete="off" data-i18n-ph="amountPh">
        </div>
        <div class="row2" style="grid-template-columns:1fr 1fr">
          <div class="setrow" style="gap:8px">
            <label class="lbl" for="xFrom" data-i18n="from" style="margin:0"></label>
            <select id="xFrom"></select>
          </div>
          <div class="setrow" style="gap:8px">
            <label class="lbl" for="xTo" data-i18n="to" style="margin:0"></label>
            <select id="xTo"></select>
          </div>
        </div>
        <p class="msg" id="xMsg" hidden></p>
        <button class="sbtn primary full" id="xBtn" type="button" data-i18n="doTransfer"></button>
      </div>
    </section>

    <section class="card">
      <div class="head mb">
        <h2 data-i18n="trips"></h2>
        <button class="link accent" id="newTripBtn" type="button" data-i18n="newTrip"></button>
      </div>
      <div class="col" id="tripForm" hidden style="margin-bottom:20px">
        <div class="setrow" style="gap:8px">
          <label class="lbl" for="tName" data-i18n="tripName" style="margin:0"></label>
          <input id="tName" type="text" maxlength="40" autocomplete="off" data-i18n-ph="tripNamePh">
        </div>
        <div class="setrow" style="gap:8px">
          <label class="lbl" for="tCur" data-i18n="tripCur" style="margin:0"></label>
          <select id="tCur"></select>
        </div>
        <div class="fieldrow">
          <div class="top">
            <label class="lbl" for="tMain" data-i18n="tripFromMain" style="margin:0"></label>
            <span class="hint" id="tHintMain"></span>
          </div>
          <input id="tMain" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>
        <div class="fieldrow">
          <div class="top">
            <label class="lbl" for="tVault" data-i18n="tripFromVault" style="margin:0"></label>
            <span class="hint" id="tHintVault"></span>
          </div>
          <select id="tVaultSel" aria-label="vault" hidden></select>
          <input id="tVault" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          <button class="sbtn" id="tUnlock" type="button" data-i18n="unlockVault" hidden></button>
        </div>
        <div class="sumline" id="tSumLine" hidden></div>
        <p class="msg" id="tMsg" hidden></p>
        <div class="formactions">
          <button class="sbtn" id="tCancel" type="button" data-i18n="cancel"></button>
          <button class="sbtn primary" id="tCreate" type="button" data-i18n="startTrip"></button>
        </div>
      </div>
      <p class="empty" id="tripEmpty" data-i18n="noTrips"></p>
      <div id="tripList"></div>
    </section>

    <section class="card" id="debtCard">
      <div class="head mb">
        <h2 data-i18n="debts"></h2>
        <button class="link accent" id="newDebtBtn" type="button" data-i18n="debtNew"></button>
      </div>
      <div class="dsum" id="dSum" hidden>
        <div class="pos"><small data-i18n="debtOwedMe"></small><b id="dSumMe"></b></div>
        <div class="neg"><small data-i18n="debtIOwe"></small><b id="dSumI"></b></div>
      </div>
      <div class="people" id="dPeople" hidden></div>
      <div class="col" id="debtForm" hidden style="margin-bottom:20px">
        <div class="seg" role="group">
          <button type="button" id="dLent" aria-pressed="true" data-i18n="debtLent"></button>
          <button type="button" id="dBorrowed" aria-pressed="false" data-i18n="debtBorrowed"></button>
        </div>

  /* ---------- курсове ---------- */

    function tryUrl(i) {

      return fetch(RATE_URLS[i], { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (j) {

          Object.keys(CURS).forEach(function (c) { var v = j.eur[c.toLowerCase()]; if (typeof v === "number" && v > 0) rates[c] = v; });
          rates.BGN = 1.95583;
          R = { ts: Date.now(), date: j.date || "", rates: rates };

    return tryUrl(0).then(function () { rateState = "ok"; renderAll(); }, function () { rateState = "fail"; renderSettings(); });
  }

  function money(n, cur) {

  function validCtx() {

  }
  function effect(e, w) {
    var ty = e.type;
    if (ty === "xfer") return (e.dst === w ? e.amount : 0) - (e.src === w ? e.amount : 0);
    var ew = (ty === "in" || ty === "out") ? (e.w || "main") : "main";

  function touches(e, w) {

  function hiddenEntry(e) {

  function goalSaved(g, cur) {
    var s = 0;
    entries.forEach(function (e) {
      if (e.goalId !== g.id) return;
      var v = e.type === "to" ? e.amount : (e.type === "from" ? -e.amount : 0);
      if (v) s += conv(v, e.cur || S.cur, cur);

  function totalAll() {

    activeTrips().forEach(function (tr) { s += bal(tr.id, S.cur); });
    goals.forEach(function (g) { s += goalSaved(g, S.cur); });

  }
  function allowNow() { return round2(conv(S.allow, S.allowCur || S.cur, S.cur)); }
  function spentToday() {

    entries.forEach(function (e) {
      if (e.type === "out" && !e.nt && (e.w || "main") === "main" && e.ts >= t0) s += conv(e.amount, e.cur || S.cur, S.cur);
    });

  }
  function sortedEntries() { return entries.slice().sort(function (a, b) { return b.ts - a.ts; }); }
  function addEntry(o) { o.id = uid(); o.ts = Date.now(); entries.push(o); save(K_E, entries); return o.id; }
  function xferCur(src, dst) {

  function goalInfo(g) {
    var t0 = startOfDay(Date.now()), saved = 0, savedToday = 0;
    entries.forEach(function (e) {
      if (e.goalId !== g.id) return;
      var v = e.type === "to" ? e.amount : (e.type === "from" ? -e.amount : 0);
      if (!v) return;

  /* ---------- автоматично спестяване ---------- */
  function spentBetween(a, b) {
    var s = 0;
    entries.forEach(function (e) {
      if (e.type === "out" && !e.nt && (e.w || "main") === "main" && e.ts >= a && e.ts < b) s += conv(e.amount, e.cur || S.cur, S.cur);
    });
    return round2(s);
  }
  function runSweeps() {
    if (sweeping) return false;
    sweeping = true;
    var changed = false, sChanged = false;
    try {
      if (S.eod && S.allow > 0 && S.eodDay) {
        var today = startOfDay(Date.now()), d = parseYmd(S.eodDay), n = 0;
        d.setDate(d.getDate() + 1);
        while (d.getTime() < today && n < 31) {
          var s0 = d.getTime(), e0 = new Date(s0); e0.setDate(e0.getDate() + 1);
          var left = round2(allowNow() - spentBetween(s0, e0.getTime()));
          var amt = Math.min(left, round2(bal("main", S.cur)));
          if (amt >= 0.01) {
            entries.push({ id: uid(), ts: e0.getTime() - 1000, type: "xfer", src: "main", dst: "savings", amount: amt, cur: S.cur, auto: "eod" });
            changed = true;
          }
          S.eodDay = ymd(d); sChanged = true;
          d.setDate(d.getDate() + 1); n++;
        }
      }
      if (S.capOn && S.cap > 0) {
        var cap = round2(conv(S.cap, S.capCur || S.cur, S.cur)), b = round2(bal("main", S.cur));
        if (b - cap >= 0.01) {
          entries.push({ id: uid(), ts: Date.now(), type: "xfer", src: "main", dst: "savings", amount: round2(b - cap), cur: S.cur, auto: "cap" });
          changed = true;
        }
      }
      if (changed) save(K_E, entries);
      if (sChanged) save(K_S, S);
    } finally { sweeping = false; }
    return changed;
  }

    renderAll(); window.scrollTo(0, 0);
  }

  /* ---------- избор на цветове ---------- */
  var pickers = {};
  function buildPicker(box, key, presets) {
    var sw = el("div", "swatches");
    presets.forEach(function (c) {
      var b = el("button", "sw"); b.type = "button"; b.style.background = c; b.setAttribute("aria-label", c);
      b.addEventListener("click", function () { S[key] = c; save(K_S, S); applyTheme(); refreshPickers(); });
      sw.appendChild(b);
    });
    var custom = el("div", "col"); custom.style.marginTop = "6px";
    var rows = {};
    [["H", 360], ["S", 100], ["L", 100]].forEach(function (d) {
      var row = el("div", "sl"); row.appendChild(el("span", null, d[0]));
      var r = el("input"); r.type = "range"; r.min = 0; r.max = d[1]; r.step = 1;
      r.setAttribute("aria-label", key + " " + d[0]);
      r.addEventListener("input", function () {
        S[key] = hsl2hex(+rows.H.value, +rows.S.value, +rows.L.value);
        applyTheme(); markSwatches(key);
      });
      r.addEventListener("change", function () { save(K_S, S); });
      rows[d[0]] = r; row.appendChild(r); custom.appendChild(row);
    });
    box.appendChild(sw); box.appendChild(custom);
    pickers[key] = { sw: sw, presets: presets, rows: rows };
  }
  function markSwatches(key) {
    var p = pickers[key]; if (!p) return;
    var btns = p.sw.children;
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute("aria-pressed", p.presets[i].toLowerCase() === String(S[key]).toLowerCase() ? "true" : "false");
  }
  function refreshPickers() {
    ["bg", "accent"].forEach(function (key) {
      var p = pickers[key]; if (!p) return;
      var hsl = hex2hsl(S[key]);
      p.rows.H.value = hsl[0]; p.rows.S.value = hsl[1]; p.rows.L.value = hsl[2];
      markSwatches(key);
    });
  }

  /* ---------- снимка ---------- */
  function readPhoto(file, cb) {
    var fr = new FileReader();
    fr.onerror = function () { cb(null); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { cb(null); };
      img.onload = function () {
        var max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { cb(c.toDataURL("image/jpeg", 0.8)); } catch (e) { cb(null); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ---------- действия: начало ---------- */
  function showMsg(id, txt) { var m = $(id); m.textContent = txt || ""; m.hidden = !txt; }
  function addMove(type) {
    var inp = $("amount"), amount = parseAmount(inp.value);
    if (amount === null) { inp.classList.add("bad"); showMsg("homeMsg", t("errAmt")); inp.focus(); return; }
    inp.classList.remove("bad"); showMsg("homeMsg", "");
    var ctx = validCtx();
    addEntry({ type: type, amount: amount, cur: wcur(ctx), w: ctx, note: $("note").value.trim() });
    inp.value = ""; $("note").value = "";
    renderAll();
  }

  /* ---------- действия: прехвърляне и екскурзии ---------- */
  function doTransfer() {
    if ((isVault($("xFrom").value) || isVault($("xTo").value)) && !canSeeVault()) { askUnlock(doTransfer); return; }
    var src = $("xFrom").value, dst = $("xTo").value, amount = parseAmount($("xAmt").value);
    $("xAmt").classList.remove("bad");
    if (amount === null) { $("xAmt").classList.add("bad"); showMsg("xMsg", t("errAmt")); return; }
    if (src === dst) { showMsg("xMsg", t("errSame")); return; }
    var c = xferCur(src, dst);
    if (round2(bal(src, c)) < amount) { showMsg("xMsg", t("errFunds")); return; }
    addEntry({ type: "xfer", src: src, dst: dst, amount: amount, cur: c });
    showMsg("xMsg", ""); $("xAmt").value = "";
    renderAll();
  }
  function parseOpt(v) {
    v = String(v).trim();
    if (!v) return 0;
    var n = parseAmount(v);
    return n === null ? null : n;
  }
  function renderTripForm() {
    var cur = $("tCur").value || S.cur;
    $("tHintMain").textContent = t("available") + money(Math.max(bal("main", cur), 0), cur);
    var seeV = canSeeVault(), vs = $("tVaultSel"), vv = visVaults();
    if (vs.options.length !== vv.length) {
      var keepV = vs.value; vs.textContent = "";
      vv.forEach(function (v) { var o = document.createElement("option"); o.value = v.id; vs.appendChild(o); });
      if (keepV) vs.value = keepV;
    }
    for (var oi = 0; oi < vs.options.length; oi++) vs.options[oi].textContent = wname(vs.options[oi].value);
    vs.hidden = vv.length < 2;
    var vid = vs.value || "vault";
    $("tHintVault").textContent = seeV ? t("available") + money(Math.max(bal(vid, cur), 0), cur) : "••••";
    $("tVault").disabled = !seeV;
    if (!seeV) $("tVault").value = "";
    $("tUnlock").hidden = seeV;
    var fm = parseOpt($("tMain").value), fv = parseOpt($("tVault").value);
    var sum = (fm || 0) + (fv || 0);
    var sl = $("tSumLine");
    sl.hidden = !(sum > 0);
    if (sum > 0) sl.textContent = t("tripTotal") + money(round2(sum), cur);
  }
  function resetTripForm() {
    $("tName").value = ""; $("tMain").value = ""; $("tVault").value = ""; $("tCur").value = S.cur;
    ["tName", "tMain", "tVault"].forEach(function (id) { $(id).classList.remove("bad"); });
    showMsg("tMsg", "");
  }
  function createTrip() {
    var name = $("tName").value.trim(), cur = $("tCur").value;
    var fm = parseOpt($("tMain").value), fv = parseOpt($("tVault").value);
    ["tName", "tMain", "tVault"].forEach(function (id) { $(id).classList.remove("bad"); });
    if (!name) { $("tName").classList.add("bad"); showMsg("tMsg", t("errTripName")); $("tName").focus(); return; }
    if (fm === null) { $("tMain").classList.add("bad"); showMsg("tMsg", t("errAmt")); $("tMain").focus(); return; }
    if (fv === null) { $("tVault").classList.add("bad"); showMsg("tMsg", t("errAmt")); $("tVault").focus(); return; }
    if (fm + fv <= 0) { $("tMain").classList.add("bad"); showMsg("tMsg", t("errTripSome")); $("tMain").focus(); return; }
    if (fv > 0 && !canSeeVault()) { askUnlock(createTrip); return; }
    if (round2(bal("main", cur)) < fm) { $("tMain").classList.add("bad"); showMsg("tMsg", t("errTripMain")); return; }
    var vid = $("tVaultSel").value || "vault";
    if (round2(bal(vid, cur)) < fv) { $("tVault").classList.add("bad"); showMsg("tMsg", t("errTripVault")); return; }
    var tr = { id: uid(), name: name, cur: cur, created: Date.now(), ended: null };
    trips.push(tr); save(K_T, trips);
    if (fm > 0) addEntry({ type: "xfer", src: "main", dst: tr.id, amount: fm, cur: cur });
    if (fv > 0) addEntry({ type: "xfer", src: vid, dst: tr.id, amount: fv, cur: cur });
    showTripForm = false; resetTripForm();
    S.ctx = tr.id; save(K_S, S);
    go("home");
  }
  function onTripClick(ev) {
    var b = ev.target.closest("[data-tact]");
    if (!b) return;
    var id = b.getAttribute("data-id"), act = b.getAttribute("data-tact"), tr = tripById(id);
    if (!tr) return;
    if (act === "open") { S.ctx = id; save(K_S, S); go("home"); return; }
    if (act === "end") endTripId = id;
    else if (act === "endno") endTripId = null;
    else if (act === "endyes") {
      var rest = round2(bal(id, tr.cur));
      if (rest > 0) addEntry({ type: "xfer", src: id, dst: "main", amount: rest, cur: tr.cur });
      else if (rest < 0) addEntry({ type: "xfer", src: "main", dst: id, amount: -rest, cur: tr.cur });
      tr.ended = Date.now(); save(K_T, trips);
      if (S.ctx === id) { S.ctx = "main"; save(K_S, S); }
      endTripId = null;
    }
    renderAll();
  }

  /* ---------- действия: цели ---------- */
  function addUnits(unit, n) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (unit === "days") d.setDate(d.getDate() + n);
    else if (unit === "weeks") d.setDate(d.getDate() + 7 * n);
    else {
      var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
      var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
    }
    return d;
  }
  function resetGoalForm() {
    $("gName").value = ""; $("gTarget").value = ""; $("gTime").value = ""; $("gUnit").value = "months";
    ["gName", "gTarget", "gTime"].forEach(function (id) { $(id).classList.remove("bad"); });
    showMsg("formMsg", "");
  }
  function createGoal() {
    var name = $("gName").value.trim(), target = parseAmount($("gTarget").value);
    var time = parseInt($("gTime").value, 10), unit = $("gUnit").value;
    var bad = null, txt = "";
    ["gName", "gTarget", "gTime"].forEach(function (id) { $(id).classList.remove("bad"); });
    if (!name) { bad = "gName"; txt = t("errName"); }
    else if (target === null) { bad = "gTarget"; txt = t("errTarget"); }
    else if (!isFinite(time) || time < 1 || time > 3650) { bad = "gTime"; txt = t("errTime"); }
    if (bad) { $(bad).classList.add("bad"); showMsg("formMsg", txt); $(bad).focus(); return; }
    goals.push({ id: uid(), name: name, target: target, cur: S.cur, deadline: ymd(addUnits(unit, time)), created: Date.now() });
    save(K_G, goals);
    showForm = false; resetGoalForm(); renderAll();
  }
  function findGoal(id) { for (var i = 0; i < goals.length; i++) if (goals[i].id === id) return goals[i]; return null; }
  function moveToGoal(g, amount) {
    if (round2(bal("main", S.cur)) < amount) { goalMsg[g.id] = t("errBal"); return false; }
    addEntry({ type: "to", amount: amount, cur: S.cur, goalId: g.id, goalName: g.name }); goalMsg[g.id] = ""; return true;
  }
  function onGoalClick(ev) {
    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var id = b.getAttribute("data-id"), act = b.getAttribute("data-act"), g = findGoal(id);
    if (!g) return;
    goalMsg[id] = "";
    if (act === "today") {
      moveToGoal(g, goalInfo(g).todayLeft);
    } else if (act === "toggle") {
      openGoal = openGoal === id ? null : id;
    } else if (act === "put" || act === "take") {
      var inp = $("oa-" + id), amount = parseAmount(inp ? inp.value : "");
      if (amount === null) goalMsg[id] = t("errAmt");
      else if (act === "put") { if (moveToGoal(g, amount)) openGoal = null; }
      else if (amount > goalInfo(g).saved) goalMsg[id] = t("errGoal");
      else { addEntry({ type: "from", amount: amount, cur: S.cur, goalId: g.id, goalName: g.name }); openGoal = null; }
    } else if (act === "del") {
      delGoalId = id;
    } else if (act === "delno") {
      delGoalId = null;
    } else if (act === "delyes") {
      var sv = goalInfo(g).saved;
      if (sv > 0) addEntry({ type: "from", amount: sv, cur: S.cur, goalId: g.id, goalName: g.name });
      goals = goals.filter(function (x) { return x.id !== id; }); save(K_G, goals);
      delGoalId = null; if (openGoal === id) openGoal = null;
    }
    renderAll();
  }

  /* ---------- събития ---------- */
  $("addBtn").addEventListener("click", function () { addMove("in"); });
  $("spendBtn").addEventListener("click", function () { addMove("out"); });
  $("amount").addEventListener("input", function () { this.classList.remove("bad"); showMsg("homeMsg", ""); });
  $("amount").addEventListener("keydown", function (e) { if (e.key === "Enter") addMove("out"); });
  $("viewAll").addEventListener("click", function () { go("history"); });
  $("chips").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-ctx]"); if (!b) return;
    var c = b.getAttribute("data-ctx");
    if (isVault(c) && !canSeeVault()) { askUnlock(function () { S.ctx = c; save(K_S, S); renderAll(); }); return; }
    S.ctx = c; save(K_S, S); renderAll();
  });
  $("quick").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-qadd")) { go("settings"); setTimeout(function () { $("qName").scrollIntoView({ block: "center" }); $("qName").focus(); }, 50); return; }
    var id = b.getAttribute("data-q"); if (id) useQuick(id);
  });
  $("qAdd").addEventListener("click", addQuick);
  $("qList").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-qdel]"); if (!b) return;
    var id = b.getAttribute("data-qdel"); quick = quick.filter(function (q) { return q.id !== id; }); save(K_Q, quick); renderAll();
  });
  $("toastUndo").addEventListener("click", function () { var f = toastUndoFn; hideToast(); if (f) f(); });
  $("newDebtBtn").addEventListener("click", function () { showDebtForm = true; resetDebtForm(); renderDebts(); $("dWho").focus(); });
  $("dCancel").addEventListener("click", function () { showDebtForm = false; resetDebtForm(); renderDebts(); });
  $("dCreate").addEventListener("click", createDebt);
  $("dLent").addEventListener("click", function () { debtDir = "lent"; renderDebts(); });
  $("dBorrowed").addEventListener("click", function () { debtDir = "borrowed"; renderDebts(); });
  $("debtCard").addEventListener("click", onDebtClick);
  $("sEod").addEventListener("change", toggleEod);
  $("sCapOn").addEventListener("change", saveCap);
  $("sCapSave").addEventListener("click", saveCap);
  $("sCapAmt").addEventListener("input", function () { this.classList.remove("bad"); showMsg("sMsg", ""); });
  $("savMove").addEventListener("click", function () { go("wallets"); });
  $("fcOn").addEventListener("change", function () { S.fc = this.checked; save(K_S, S); renderAll(); });
  $("glass").addEventListener("input", function () { S.glass = +this.value; applyTheme(); });
  $("glass").addEventListener("change", function () { save(K_S, S); });
  $("vAdd").addEventListener("click", addVault);
  $("vName").addEventListener("input", function () { this.classList.remove("bad"); showMsg("vMsg", ""); });
  $("vList").addEventListener("click", function (ev) { var b = ev.target.closest("[data-vdel]"); if (b) delVault(b.getAttribute("data-vdel")); });
  $("tVaultSel").addEventListener("change", renderTripForm);
  $("dWho").addEventListener("input", renderDebtHint);
  $("aSave").addEventListener("click", function () {
    var n = parseAmount($("aAmt").value);
    if (n === null) { showMsg("aMsg", t("errAmt")); return; }
    S.allow = n; S.allowCur = S.cur; save(K_S, S); showMsg("aMsg", t("allowSaved")); renderAll();
  });
  $("aOff").addEventListener("click", function () { S.allow = 0; save(K_S, S); $("aAmt").value = ""; showMsg("aMsg", ""); renderAll(); });
  $("aAmt").addEventListener("input", function () { showMsg("aMsg", ""); });
  $("lockNow").addEventListener("click", lockVault);
  $("revealBtn").addEventListener("click", function () { askUnlock(); });
  $("mOk").addEventListener("click", submitModal);
  $("mCancel").addEventListener("click", closeModal);
  $("tUnlock").addEventListener("click", function () { askUnlock(renderTripForm); });
  ["tMain", "tVault"].forEach(function (id) { $(id).addEventListener("input", function () { this.classList.remove("bad"); showMsg("tMsg", ""); renderTripForm(); }); });
  $("tCur").addEventListener("change", renderTripForm);
  document.addEventListener("visibilitychange", function () { if (document.hidden) lockVault(); else if (runSweeps()) renderAll(); });
  setInterval(function () { if (!document.hidden && runSweeps()) renderAll(); }, 60000);
  document.addEventListener("pointerdown", touchIdle, true);
  document.addEventListener("keydown", touchIdle, true);

  $("xBtn").addEventListener("click", doTransfer);
  $("xFrom").addEventListener("change", renderXferLabel);
  $("xTo").addEventListener("change", renderXferLabel);
  $("xAmt").addEventListener("input", function () { this.classList.remove("bad"); showMsg("xMsg", ""); });
  $("newTripBtn").addEventListener("click", function () { showTripForm = true; $("tCur").value = S.cur; renderWallets(); $("tName").focus(); });
  $("tCancel").addEventListener("click", function () { showTripForm = false; resetTripForm(); renderWallets(); });
  $("tCreate").addEventListener("click", createTrip);
  $("tripList").addEventListener("click", onTripClick);

  $("newGoalBtn").addEventListener("click", function () { showForm = true; renderGoals(); $("gName").focus(); });
  $("gCancel").addEventListener("click", function () { showForm = false; resetGoalForm(); renderGoals(); });
  $("gCreate").addEventListener("click", createGoal);
  $("goalList").addEventListener("click", onGoalClick);

  $("histList").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-del]");
    if (!b) return;
    var id = b.getAttribute("data-del");
    entries = entries.filter(function (e) { return e.id !== id; });
    save(K_E, entries); renderAll();
  });
  $("clearBtn").addEventListener("click", function () { $("clearBtn").hidden = true; $("confirmBox").hidden = false; });
  $("noBtn").addEventListener("click", function () { $("confirmBox").hidden = true; renderHistory(); });
  $("yesBtn").addEventListener("click", function () {
    entries = []; save(K_E, entries);
    trips = trips.filter(function (x) { return !x.ended; }); save(K_T, trips);
    $("confirmBox").hidden = true; renderAll();
  });

  $("langBg").addEventListener("click", function () { S.lang = "bg"; save(K_S, S); renderAll(); });
  $("langEn").addEventListener("click", function () { S.lang = "en"; save(K_S, S); renderAll(); });
  $("curSel").addEventListener("change", function () { S.cur = this.value; save(K_S, S); renderAll(); });
  $("rateBtn").addEventListener("click", function () { fetchRates(true); });

  $("photoBtn").addEventListener("click", function () { $("photoFile").click(); });
  $("photoFile").addEventListener("change", function () {
    var f = this.files && this.files[0]; this.value = "";
    if (!f) return;
    readPhoto(f, function (url) {
      var ok = false;
      if (url) { try { localStorage.setItem(K_P, url); ok = true; } catch (e) {} }
      if (!ok) { showMsg("photoMsg", t("photoErr")); return; }
      showMsg("photoMsg", ""); S.photo = true; save(K_S, S); applyPhoto();
    });
  });
  $("photoRm").addEventListener("click", function () {
    try { localStorage.removeItem(K_P); } catch (e) {}
    S.photo = false; save(K_S, S); applyPhoto();
  });
  $("dim").addEventListener("input", function () { S.dim = +this.value; applyTheme(); });
  $("dim").addEventListener("change", function () { save(K_S, S); });

  $("gearBtn").addEventListener("click", function () { go(page === "settings" ? "home" : "settings"); });
  var navBtns = document.querySelectorAll(".nav button");
  for (var i = 0; i < navBtns.length; i++) {
    navBtns[i].addEventListener("click", function () { go(this.getAttribute("data-go")); });
  }

  /* ---------- старт ---------- */
  var st = load(K_S, {});
  if (st.lang === "en" || st.lang === "bg") S.lang = st.lang;
  if (st.cur && CURS[st.cur]) S.cur = st.cur;
  if (typeof st.ctx === "string") S.ctx = st.ctx;
  if (validHex(st.bg)) S.bg = st.bg;
  if (validHex(st.accent)) S.accent = st.accent;
  if (typeof st.dim === "number" && st.dim >= 0 && st.dim <= 90) S.dim = st.dim;
  S.photo = !!st.photo;
  if (st.fc === false) S.fc = false;
  if (typeof st.glass === "number" && st.glass >= 0 && st.glass <= 85) S.glass = st.glass;
  S.eod = !!st.eod; S.eodDay = typeof st.eodDay === "string" ? st.eodDay : "";
  if (typeof st.cap === "number" && st.cap > 0) { S.cap = st.cap; S.capCur = CURS[st.capCur] ? st.capCur : S.cur; S.capOn = !!st.capOn; }
  if (typeof st.allow === "number" && st.allow > 0) { S.allow = st.allow; S.allowCur = CURS[st.allowCur] ? st.allowCur : S.cur; }

  quick = load(K_Q, []); debts = load(K_D, []);
  if (!Array.isArray(quick)) quick = [];
  if (!Array.isArray(debts)) debts = [];
  var vl = load(K_VL, null);
  if (Array.isArray(vl) && vl.length && vl.every(function (v) { return v && typeof v.id === "string"; })) {
    vaultList = vl.map(function (v) { return { id: v.id, name: typeof v.name === "string" ? v.name : "", hidden: !!v.hidden }; });
    if (!vaultById("vault")) vaultList.unshift({ id: "vault", name: "" });
  }
  V = load(K_V, null);
  if (!V || typeof V.hash !== "string" || typeof V.salt !== "string") V = null;
  entries = load(K_E, []); goals = load(K_G, []); trips = load(K_T, []); R = load(K_R, null);
  if (!Array.isArray(entries)) entries = [];
  if (!Array.isArray(goals)) goals = [];
  if (!Array.isArray(trips)) trips = [];
  /* Записи от стари версии нямат валута: приемаме текущата. */
  var changed = false;
  entries.forEach(function (e) { if (!e.cur) { e.cur = S.cur; changed = true; } });
  if (changed) save(K_E, entries);
  changed = false;
  goals.forEach(function (g) { if (!g.cur) { g.cur = S.cur; changed = true; } });
  if (changed) save(K_G, goals);

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  buildPicker($("bgPick"), "bg", BG_PRESETS);
  buildPicker($("acPick"), "accent", AC_PRESETS);
  applyPhoto();
  renderAll();
  fetchRates(false);

  try { parent.postMessage("moite-pari-ok", "*"); } catch (e) {}
})();
</script>
